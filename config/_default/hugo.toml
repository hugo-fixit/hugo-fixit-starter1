# -------------------------------------------------------------------------------------
# Hugo Configuration
# See: https://gohugo.io/configuration/all/
# -------------------------------------------------------------------------------------

# Website title.
title = ""
# Hostname (and path) to the root.
baseURL = "http://localhost:1313"
# Theme list.
# Enable in your site config file.
# theme = ["FixIt"]
# Determines default content language.
# Available values: ["en", "zh-cn", "fr", "pl", ...]
defaultContentLanguage = "en"
# Language code.
# Available values: ["en", "zh-CN", "fr", "pl", ...]
locale = "en"
# Language name.
# Available values: ["English", "简体中文", "Français", "Polski", ...]
label = "English"
# Whether to include Chinese/Japanese/Korean.
hasCJKLanguage = false
# Timezone local.
# timeZone = "Asia/Shanghai"
# Copyright description used only for SEO schema.
copyright = ""
# Whether to use robots.txt.
enableRobotsTXT = true
# Whether to use git commit log.
enableGitInfo = true
# Whether to use emoji code.
enableEmoji = true
# The capitalization rules to follow.
# Available values: ["ap", "chicago", "go", "firstupper", "none"]
titleCaseStyle = "ap"
# Whether to capitalize automatic list titles.
capitalizeListTitles = false
# The main sections of a site.
# If set, the MainSections method on the Site object returns the given sections,
# otherwise it returns the section with the most pages.
# mainSections = ["posts"]
# The editor to use when creating new content.
# newContentEditor = "code"
# Ignore some build warnings and errors.
# Only messages logged with a message ID (`warnidf` / `erroridf`) can be ignored here.
# See: https://gohugo.io/functions/fmt/warnidf/ | https://gohugo.io/functions/fmt/erroridf/
# Available values:
#   FixIt message IDs:
#     "error-get-remote-json"            - failed to get remote JSON
#     "v1-deprecated-codeblock-attr"     - deprecated code block attributes
#     "v1-deprecated-file-tree-attr"     - deprecated file-tree code block attributes
#     "v1-deprecated-file-tree-param"    - deprecated file-tree shortcode parameters
#     "v1-deprecated-json-viewer-attr"   - deprecated JSON viewer code block attributes
#     "v1-deprecated-toggle-attr"        - deprecated toggle code block attributes
#     "warning-dev-env"                  - development environment (non-production)
#     "warning-dev-version"              - development version of FixIt
#     "warning-encryption"               - encrypted pages require decryption
#     "warning-file-tree"                - file-tree data file or root path not found
#     "warning-link-check"               - external link check failed
#     "warning-pagefind"                 - Pagefind search index not found
#     "warning-remote-image"             - failed to get remote image
#   Hugo message IDs:
#     "err-youtube-remote"               - youtube shortcode failed to retrieve remote data
#     "shortcode-vimeo-simple"           - vimeo_simple shortcode failed to retrieve remote data
#     "shortcode-x-getremote"            - x shortcode failed to retrieve remote data
#     "shortcode-x-simple-getremote"     - x_simple shortcode failed to retrieve remote data
#     "warning-goldmark-raw-html"        - raw HTML omitted while rendering
#     "warning-home-page-is-leaf-bundle" - home page treated as a leaf bundle
#     "warning-partial-superfluous-prefix" - superfluous "partials/" prefix in partial call
#     "warning-rendershortcodes-in-html" - .RenderShortcodes detected inside HTML block
ignoreLogs = []
